[workspace]
authors = ["Min RK <benjaminrk@gmail.com>"]
channels = ["conda-forge"]
name = "fernando-hub"
platforms = ["osx-arm64"]
version = "0.1.0"

[system-requirements]
macos = "25.0"

[tasks]
update-daemons = "sudo cp -v LaunchDaemons/*.plist /Library/LaunchDaemons/"
reload-daemons = { cmd = "bash -c 'for f in /Library/LaunchDaemons/org.jupyter.hub.*.plist; do echo reloading $f; sudo launchctl unload $f; sudo launchctl load $f; done'", depends-on = [
  "update-daemons",
] }
restart-daemons = "sh -c 'for name in $(sudo launchctl list | grep org.jupyter.hub | cut -f 3); do echo restarting $name; sudo launchctl kickstart -k system/$name; done'"
setup-logs = "sudo mkdir -p /Library/Logs/jupyterhub/traefik; sudo chown -R _traefik:admin /Library/Logs/jupyterhub/traefik"
install = "pixi install -a"
permissions = "sudo chown -R root:admin /opt/jupyterhub; sudo chmod -R a+rX /opt/jupyterhub/.pixi/envs; sudo chmod -R g+rw /opt/jupyterhub/; sudo chmod 0600 /opt/jupyterhub/traefik/acme.json; "
logs-permissions = "sudo mkdir -p /Library/Logs/jupyterhub /Library/Logs/llm; sudo chgrp -R admin /Library/Logs/jupyterhub /Library/Logs/llm; sudo chmod g+rX /Library/Logs/jupyterhub /Library/Logs/llm; sudo chown -R _llm /Library/Logs/llm"
update-server-config = "ln -sf $PWD/jupyterhub/jupyter_server_config.py .pixi/envs/user/etc/jupyter/jupyter_server_config.py"

[feature.user.tasks]
opencode-config = { cmd = "opencode/configure-opencode" }
# workaround Error: MLX not available: failed to load MLX dynamic library
# setting OLLAMA_LIBRARY_PATH doesn't work
fix-ollama = { cmd = "ln -s $CONDA_PREFIX/lib/libmlx.dylib $CONDA_PREFIX/bin/" }

[tasks.update-envs]
depends-on = ["install", "permissions", "update-server-config"]

[feature.hub.tasks]
jupyterhub = { cmd = ["jupyterhub"], cwd = "jupyterhub" }
proxy = { cmd = ["traefik", "--configfile=traefik.toml"], cwd = "traefik" }

[feature.health.tasks]
healthcheck = { cmd = ["python3", "healthcheck.py"] }

[dependencies]

[feature.health.dependencies]
python = "3.12.*"
httpx = "*"

# shared dependencies across hub and user
# not 'default' because we might have tasks
# without dependencies
[feature.common.dependencies]
python = "3.12.*"
jupyterhub-base = "5.4.*"

# Hub environment
[feature.hub.dependencies]
jupyterhub-traefik-proxy = "*"
oauthenticator = "*"

# User environment
[feature.user.dependencies]
jupyterlab = "*"
ipywidgets = ">=8.1.8,<9"
altair = "*"
jupyter-collaboration = "*"
ruff = "*"
jupyterlab_code_formatter = "*"
pre-commit = "*"
matplotlib-base = "*"
scipy = "*"
uv = "*"
# model runners
ollama = "*"
mlx-lm = ">=0.31"
# save vllm for later
# vllm = "*"
ollama-python = "*"
# needed for gpt-oss parser
openai-harmony = "*"
# vllm-metal dependencies
mlx-vlm = "*"
accelerate = "*"

# jupyter-ai
jupyter-ai = "3.*"
jupyterlab-myst = ">=2.6.0,<3"
mystmd = ">=1.8.3,<2"
jupyter_server_documents = ">=0.2.0,<0.3"
jupyterlab-geojson = ">=3.4.0,<4"
jupyterlab-favorites = ">=3.5.0,<4"
pywavelets = ">=1.9.0,<2"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.8.0,<2"
sympy = ">=1.14.0,<2"
pandas = ">=3.0.2,<4"
geopandas = ">=1.1.3,<2"
scikit-image = ">=0.26.0,<0.27"
ipyleaflet = ">=0.20.0,<0.21"
pillow = ">=12.2.0,<13"
pytest = ">=9.0.3,<10"
pytest-notebook = ">=0.10.0,<0.11"
pytest-cov = ">=7.1.0,<8"
xarray = ">=2026.4.0,<2027"
yaml = ">=0.2.5,<0.3"
zarr = ">=3.1.6,<4"
h5py = ">=3.16.0,<4"
hdf5 = ">=2.1.0,<3"
cartopy = ">=0.25.0,<0.26"
coverage = ">=7.13.5,<8"

[feature.user.pypi-dependencies]
jupyter-geoagent = { git = "https://github.com/geojupyter/jupyter-geoagent" }

# [feature.user.pypi-dependencies]
# vllm metal plugin (only has wheel for cp312)
# vllm-metal = "*"


[environments]
user = ["user", "common"]
hub = ["hub", "common"]
healthcheck = ["health"]
